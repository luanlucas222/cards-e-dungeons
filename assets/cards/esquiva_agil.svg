<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="dodgeBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="60%" stop-color="#07151c"/>
      <stop offset="100%" stop-color="#02070a"/>
    </radialGradient>
    <linearGradient id="arcTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dodgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#dodgeBg)"/>

  <!-- Dramatic Evasion Arc Trails -->
  <path d="M 60 340 C 90 200 180 80 320 120" stroke="url(#arcTrail)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#dodgeGlow)"/>
  <path d="M 80 320 C 120 180 200 90 310 130" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#dodgeGlow)"/>
  <path d="M 100 300 C 140 170 210 100 300 140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Missed Enemy Arrows Piercing the Wall -->
  <g opacity="0.85">
    <!-- Arrow 1 - Piercing Stone -->
    <line x1="20" y1="210" x2="170" y2="210" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="170,205 185,210 170,215" fill="#cbd5e1"/>
    <path d="M 25 204 L 35 210 L 25 216 M 35 204 L 45 210 L 35 216" stroke="#f1f5f9" stroke-width="2"/>
    <!-- Impact dust -->
    <circle cx="185" cy="210" r="8" fill="#64748b" opacity="0.4"/>

    <!-- Arrow 2 - Passing harmlessly below -->
    <line x1="40" y1="280" x2="260" y2="265" stroke="#94a3b8" stroke-width="3.5"/>
    <polygon points="260,260 275,264 261,270" fill="#cbd5e1"/>
    <path d="M 45 276 L 55 279 L 47 286" stroke="#f1f5f9" stroke-width="1.8"/>

    <!-- Arrow 3 - Grazing above -->
    <line x1="60" y1="120" x2="200" y2="105" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="200,101 214,104 201,110" fill="#cbd5e1"/>
  </g>

  <!-- Acrobatic Shadow Rogue in Mid-Air Leap / Flip -->
  <g transform="translate(225, 175) rotate(-22)">
    <!-- Motion Blur Ghost Silhouette (Afterimage) -->
    <path d="M -25 -50 C 0 -65 30 -50 35 -20 C 40 10 20 40 0 55 C -20 40 -35 10 -35 -20 Z" fill="#0284c7" opacity="0.35" transform="translate(-30, 20)"/>

    <!-- Main Leaping Body -->
    <!-- Cloak flutter -->
    <path d="M -30 -30 C -65 -20 -80 20 -70 60 C -50 40 -30 20 -15 0 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Torso and Limbs -->
    <ellipse cx="0" cy="0" rx="22" ry="38" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <!-- Head / Mask -->
    <circle cx="15" cy="-42" r="16" fill="#082f49" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Glowing Visor Eye -->
    <ellipse cx="20" cy="-42" rx="4" ry="2" fill="#38bdf8" filter="url(#dodgeGlow)"/>
    <circle cx="21" cy="-42" r="1" fill="#ffffff"/>

    <!-- Legs in graceful flip -->
    <path d="M -10 32 L -25 75 L -40 90" stroke="#075985" stroke-width="8" stroke-linecap="round"/>
    <path d="M 12 30 L 28 68 L 15 95" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Speed Spurt Sparkles -->
  <circle cx="290" cy="110" r="3" fill="#ffffff" filter="url(#dodgeGlow)"/>
  <circle cx="140" cy="240" r="2.5" fill="#7dd3fc"/>
  <circle cx="340" cy="160" r="2" fill="#38bdf8"/>
  <circle cx="180" cy="90" r="2" fill="#ffffff"/>
</svg>
