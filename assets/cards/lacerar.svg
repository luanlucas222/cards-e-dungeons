<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lacerateBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="60%" stop-color="#1c0404"/>
      <stop offset="100%" stop-color="#090101"/>
    </radialGradient>
    <linearGradient id="slashGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#lacerateBg)"/>

  <!-- Torn Metal Shield Plate in Background -->
  <g opacity="0.6">
    <path d="M 120 70 L 280 70 L 260 330 L 200 360 L 140 330 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <line x1="200" y1="70" x2="200" y2="360" stroke="#334155" stroke-width="2"/>
    <circle cx="150" cy="95" r="4" fill="#64748b"/>
    <circle cx="250" cy="95" r="4" fill="#64748b"/>
  </g>

  <!-- 3 Visceral Claw Slash Gouges Cutting Across the Metal -->
  <!-- Slash 1 (Top) -->
  <path d="M 60 110 Q 180 180 320 150" stroke="#7f1d1d" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 60 110 Q 180 180 320 150" stroke="url(#slashGlow)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
  <path d="M 80 118 Q 180 178 300 152" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Slash 2 (Center - Deepest) -->
  <path d="M 80 170 Q 210 250 350 210" stroke="#7f1d1d" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M 80 170 Q 210 250 350 210" stroke="url(#slashGlow)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
  <path d="M 100 180 Q 210 248 330 214" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Slash 3 (Bottom) -->
  <path d="M 110 240 Q 230 320 370 280" stroke="#7f1d1d" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 110 240 Q 230 320 370 280" stroke="url(#slashGlow)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#crimsonGlow)"/>
  <path d="M 130 248 Q 230 318 350 282" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Crimson Blood & Spark Splatters -->
  <g fill="#ef4444" filter="url(#crimsonGlow)">
    <circle cx="210" cy="220" r="5"/>
    <circle cx="240" cy="200" r="3.5"/>
    <circle cx="170" cy="240" r="4"/>
    <circle cx="290" cy="180" r="3"/>
    <circle cx="140" cy="150" r="4.5"/>
    <circle cx="310" cy="250" r="3.5"/>
    <circle cx="230" cy="290" r="4"/>
  </g>

  <!-- Blood Droplets Flying -->
  <path d="M 190 220 Q 200 240 185 260 Q 180 240 190 220 Z" fill="#b91c1c"/>
  <path d="M 270 190 Q 290 210 280 230 Q 265 210 270 190 Z" fill="#dc2626"/>
  <path d="M 230 280 Q 240 310 225 330 Q 215 310 230 280 Z" fill="#991b1b"/>

  <!-- Intense White Spark Flashes at impact points -->
  <polygon points="190,210 195,215 190,220 185,215" fill="#ffffff" filter="url(#crimsonGlow)"/>
  <polygon points="260,195 264,199 260,203 256,199" fill="#ffffff" filter="url(#crimsonGlow)"/>
  <polygon points="220,285 224,289 220,293 216,289" fill="#ffffff" filter="url(#crimsonGlow)"/>
</svg>
