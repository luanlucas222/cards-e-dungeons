<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="60%" stop-color="#140824"/>
      <stop offset="100%" stop-color="#07030c"/>
    </radialGradient>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d8b4fe"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Speed Motion Trails -->
  <path d="M 50 120 Q 200 180 340 100" stroke="#a855f7" stroke-width="4" fill="none" opacity="0.6" filter="url(#purpleGlow)"/>
  <path d="M 60 280 Q 220 220 350 300" stroke="#c084fc" stroke-width="6" fill="none" opacity="0.7" filter="url(#purpleGlow)"/>
  <path d="M 30 200 Q 180 210 370 180" stroke="#e9d5ff" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Arc Slash Wind -->
  <path d="M 80 80 A 180 180 0 0 1 320 320" stroke="url(#bladeEdge)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#purpleGlow)"/>
  <path d="M 120 60 A 200 200 0 0 1 340 280" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Dagger 1 (Left - Diagonal Down-Right) -->
  <g transform="translate(140, 160) rotate(-35)">
    <!-- Shadow -->
    <path d="M 0 -80 L 14 30 L 0 50 L -14 30 Z" fill="#000000" opacity="0.5"/>
    <!-- Blade -->
    <path d="M 0 -95 L 12 25 L 0 40 L -12 25 Z" fill="url(#bladeGrad1)" stroke="#d8b4fe" stroke-width="1.5"/>
    <!-- Fuller / Center Ridge -->
    <line x1="0" y1="-85" x2="0" y2="25" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Guard -->
    <path d="M -22 35 Q 0 45 22 35 L 18 45 Q 0 52 -18 45 Z" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="-6" y="45" width="12" height="35" rx="3" fill="#18042b" stroke="#7e22ce" stroke-width="1"/>
    <!-- Pommel -->
    <circle cx="0" cy="85" r="7" fill="#581c87" stroke="#e9d5ff" stroke-width="1.5"/>
    <circle cx="0" cy="85" r="3" fill="#c084fc"/>
  </g>

  <!-- Dagger 2 (Right - Diagonal Up-Left) -->
  <g transform="translate(240, 220) rotate(145)">
    <!-- Blade -->
    <path d="M 0 -95 L 12 25 L 0 40 L -12 25 Z" fill="url(#bladeGrad1)" stroke="#d8b4fe" stroke-width="1.5"/>
    <!-- Fuller -->
    <line x1="0" y1="-85" x2="0" y2="25" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Guard -->
    <path d="M -22 35 Q 0 45 22 35 L 18 45 Q 0 52 -18 45 Z" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="-6" y="45" width="12" height="35" rx="3" fill="#18042b" stroke="#7e22ce" stroke-width="1"/>
    <!-- Pommel -->
    <circle cx="0" cy="85" r="7" fill="#581c87" stroke="#e9d5ff" stroke-width="1.5"/>
    <circle cx="0" cy="85" r="3" fill="#c084fc"/>
  </g>

  <!-- Sparks and Particles -->
  <circle cx="210" cy="180" r="3" fill="#ffffff" filter="url(#purpleGlow)"/>
  <circle cx="170" cy="130" r="2" fill="#e9d5ff"/>
  <circle cx="260" cy="230" r="2.5" fill="#c084fc"/>
  <circle cx="130" cy="250" r="1.5" fill="#d8b4fe"/>
  <circle cx="280" cy="140" r="2" fill="#ffffff"/>
</svg>
