<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="poisonBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01130e"/>
    </radialGradient>
    <linearGradient id="poisonBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#poisonBg)"/>

  <!-- Poisonous Fumes & Mists in Background -->
  <path d="M 50 320 Q 90 220 180 260 Q 260 300 340 210 Q 380 150 350 90" stroke="#10b981" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.18" filter="url(#emeraldGlow)"/>
  <path d="M 30 220 Q 140 180 220 220 Q 300 270 370 200" stroke="#34d399" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#emeraldGlow)"/>

  <!-- Serrated Curved Poison Dagger -->
  <g transform="translate(200, 190) rotate(-28)">
    <!-- Aura of Poison -->
    <path d="M 0 -130 Q 30 -40 18 35 L 0 50 L -18 35 Q -30 -40 0 -130 Z" fill="#10b981" opacity="0.35" filter="url(#emeraldGlow)"/>
    <!-- Blade -->
    <path d="M 0 -120 Q 24 -35 14 30 L 0 42 L -14 30 Q -24 -35 0 -120 Z" fill="url(#poisonBlade)" stroke="#a7f3d0" stroke-width="2"/>
    <!-- Central Poison Channel -->
    <path d="M 0 -105 Q 6 -20 0 25" stroke="#052e16" stroke-width="3" fill="none"/>
    <path d="M 0 -105 Q 6 -20 0 25" stroke="#34d399" stroke-width="1.2" fill="none"/>

    <!-- Crossguard with Serpent Motif -->
    <path d="M -30 35 C -15 48 15 48 30 35 C 22 50 -22 50 -30 35 Z" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="0" cy="42" r="4" fill="#10b981" filter="url(#emeraldGlow)"/>

    <!-- Handle -->
    <rect x="-7" y="47" width="14" height="42" rx="3" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <line x1="-6" y1="58" x2="6" y2="58" stroke="#10b981" stroke-width="1"/>
    <line x1="-6" y1="68" x2="6" y2="68" stroke="#10b981" stroke-width="1"/>
    <line x1="-6" y1="78" x2="6" y2="78" stroke="#10b981" stroke-width="1"/>

    <!-- Skull/Snake Pommel -->
    <circle cx="0" cy="95" r="9" fill="#047857" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="-3" cy="94" r="1.5" fill="#a7f3d0"/>
    <circle cx="3" cy="94" r="1.5" fill="#a7f3d0"/>
  </g>

  <!-- Venom Droplets dripping from tip -->
  <path d="M 138 275 C 138 270 148 270 148 275 C 148 285 143 293 143 293 C 143 293 138 285 138 275 Z" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="143" cy="315" r="4.5" fill="#10b981" filter="url(#emeraldGlow)"/>
  <circle cx="143" cy="335" r="3" fill="#6ee7b7" filter="url(#emeraldGlow)"/>
  <ellipse cx="145" cy="358" rx="22" ry="6" fill="#047857" opacity="0.7"/>
  <ellipse cx="145" cy="358" rx="14" ry="3.5" fill="#34d399" filter="url(#emeraldGlow)"/>

  <!-- Toxic bubbles -->
  <circle cx="180" cy="140" r="5" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.75"/>
  <circle cx="270" cy="220" r="4" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.6"/>
  <circle cx="220" cy="310" r="6" fill="none" stroke="#a7f3d0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="170" r="3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.7"/>
</svg>
