<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="65%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#030108"/>
    </radialGradient>
    <linearGradient id="cloakMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#1e0a38"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </linearGradient>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#shadowBg)"/>

  <!-- Dissolving smoke tendrils -->
  <path d="M 120 380 C 150 300 90 240 160 170 C 210 120 180 70 200 40" stroke="#7e22ce" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#shadowBlur)"/>
  <path d="M 280 380 C 250 290 310 210 240 150 C 190 100 230 60 210 40" stroke="#a855f7" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#shadowBlur)"/>
  <path d="M 180 390 C 210 320 170 260 210 190 C 230 150 200 110 200 70" stroke="#c084fc" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.35" filter="url(#shadowBlur)"/>

  <!-- Ghostly Footsteps on Ground -->
  <ellipse cx="140" cy="350" rx="20" ry="7" fill="#6b21a8" opacity="0.4" filter="url(#shadowBlur)"/>
  <ellipse cx="230" cy="310" rx="18" ry="6" fill="#a855f7" opacity="0.5" filter="url(#shadowBlur)"/>
  <ellipse cx="170" cy="270" rx="16" ry="5" fill="#c084fc" opacity="0.6" filter="url(#shadowBlur)"/>

  <!-- Hooded Shadow Rogue Silhouette dissolving -->
  <g transform="translate(200, 150)">
    <!-- Hood and shoulders -->
    <path d="M 0 -85 C 35 -85 55 -40 60 20 C 65 80 40 120 0 140 C -40 120 -65 80 -60 20 C -55 -40 -35 -85 0 -85 Z" fill="url(#cloakMist)" stroke="#9333ea" stroke-width="1.5"/>

    <!-- Inner face shadow cavity -->
    <path d="M 0 -60 C 22 -60 30 -30 28 5 C 24 35 12 45 0 45 C -12 45 -24 35 -28 5 C -30 -30 -22 -60 0 -60 Z" fill="#020005"/>

    <!-- Glowing Violet Eyes in the Darkness -->
    <ellipse cx="-13" cy="-10" rx="7" ry="3" fill="#c084fc" transform="rotate(-6 -13 -10)"/>
    <circle cx="-13" cy="-10" r="1.5" fill="#ffffff"/>
    <ellipse cx="13" cy="-10" rx="7" ry="3" fill="#c084fc" transform="rotate(6 13 -10)"/>
    <circle cx="13" cy="-10" r="1.5" fill="#ffffff"/>

    <!-- Smoke trails dissolving off the cloak -->
    <path d="M -50 60 Q -90 90 -70 140 Q -50 170 -30 190" stroke="#7e22ce" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 50 60 Q 90 90 70 140 Q 50 170 30 190" stroke="#a855f7" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M -15 130 Q 0 180 -10 220" stroke="#c084fc" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Ambient magical particles -->
  <circle cx="90" cy="120" r="2" fill="#c084fc"/>
  <circle cx="310" cy="140" r="2.5" fill="#e9d5ff"/>
  <circle cx="80" cy="260" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="320" cy="270" r="2" fill="#d8b4fe"/>
  <circle cx="200" cy="60" r="2.5" fill="#ffffff" filter="url(#shadowBlur)"/>
</svg>
