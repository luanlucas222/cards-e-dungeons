<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="volleyBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="missileCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="80%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="volleyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#volleyBg)"/>

  <!-- Swirling Arcane Energy Whirlwind in Background -->
  <path d="M 40 320 C 140 280 180 200 360 80" stroke="#1d4ed8" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#volleyGlow)"/>
  <path d="M 60 120 C 160 160 220 240 370 300" stroke="#2563eb" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#volleyGlow)"/>

  <!-- Five Arcane Magic Missiles Screaming Forward -->

  <!-- Missile 1 (Center Lead - Powerful) -->
  <g transform="translate(180, 200) rotate(-15)">
    <!-- Trail -->
    <path d="M -150 0 C -90 10 -40 -10 20 0" stroke="url(#missileCore)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#volleyGlow)"/>
    <path d="M -150 0 C -90 10 -40 -10 20 0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Head / Dart -->
    <polygon points="40,0 15,-8 10,0 15,8" fill="#ffffff" filter="url(#volleyGlow)"/>
    <circle cx="28" cy="0" r="10" fill="#38bdf8" filter="url(#volleyGlow)"/>
    <circle cx="28" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Missile 2 (Top Right) -->
  <g transform="translate(210, 120) rotate(-8)">
    <path d="M -160 0 C -100 -8 -50 8 10 0" stroke="url(#missileCore)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#volleyGlow)"/>
    <polygon points="30,0 10,-6 6,0 10,6" fill="#ffffff" filter="url(#volleyGlow)"/>
    <circle cx="20" cy="0" r="8" fill="#60a5fa" filter="url(#volleyGlow)"/>
    <circle cx="20" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Missile 3 (Bottom Center) -->
  <g transform="translate(190, 280) rotate(-22)">
    <path d="M -140 0 C -80 12 -30 -6 15 0" stroke="url(#missileCore)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#volleyGlow)"/>
    <polygon points="32,0 12,-6 8,0 12,6" fill="#ffffff" filter="url(#volleyGlow)"/>
    <circle cx="22" cy="0" r="8" fill="#60a5fa" filter="url(#volleyGlow)"/>
    <circle cx="22" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Missile 4 (Top High) -->
  <g transform="translate(140, 70) rotate(-2)">
    <path d="M -120 0 L 10 0" stroke="url(#missileCore)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#volleyGlow)"/>
    <circle cx="15" cy="0" r="6" fill="#38bdf8" filter="url(#volleyGlow)"/>
    <circle cx="15" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Missile 5 (Bottom Low) -->
  <g transform="translate(130, 335) rotate(-30)">
    <path d="M -110 0 L 10 0" stroke="url(#missileCore)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#volleyGlow)"/>
    <circle cx="15" cy="0" r="6" fill="#38bdf8" filter="url(#volleyGlow)"/>
    <circle cx="15" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Arcane Spiraling Energy Particles -->
  <circle cx="280" cy="180" r="3" fill="#ffffff" filter="url(#volleyGlow)"/>
  <circle cx="330" cy="160" r="2.5" fill="#93c5fd"/>
  <circle cx="310" cy="240" r="3" fill="#bfdbfe"/>
  <circle cx="250" cy="100" r="2" fill="#ffffff"/>
  <circle cx="230" cy="290" r="2" fill="#60a5fa"/>
  <circle cx="350" cy="210" r="2.5" fill="#ffffff" filter="url(#volleyGlow)"/>
</svg>
