<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="frostBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="55%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#02131e"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#frostBg)"/>

  <!-- Subzero Blizzard Mist in Background -->
  <path d="M 40 80 Q 200 130 360 70" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.2" filter="url(#iceGlow)"/>
  <path d="M 30 320 Q 180 270 370 310" stroke="#7dd3fc" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#iceGlow)"/>

  <!-- Piercing Horizontal Frost Beam through Center -->
  <path d="M 20 200 L 380 200" stroke="#0284c7" stroke-width="45" stroke-linecap="round" opacity="0.3" filter="url(#iceGlow)"/>
  <path d="M 20 200 L 380 200" stroke="url(#beamGrad)" stroke-width="22" stroke-linecap="round" filter="url(#iceGlow)"/>
  <path d="M 20 200 L 380 200" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Runic Frost Circles at Focus Point -->
  <circle cx="120" cy="200" r="45" stroke="#bae6fd" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.85" filter="url(#iceGlow)"/>
  <circle cx="120" cy="200" r="28" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 7" fill="none"/>

  <!-- Sharp Jagged Floating Ice Crystals / Spikes -->
  <!-- Top Crystals -->
  <polygon points="170,120 185,60 195,125 182,145" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#iceGlow)"/>
  <polygon points="250,140 270,75 285,145 265,160" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#iceGlow)"/>
  <polygon points="100,145 110,95 125,148 115,165" fill="url(#crystalGrad)" stroke="#bae6fd" stroke-width="1.2"/>

  <!-- Bottom Crystals -->
  <polygon points="190,270 205,340 215,268 200,250" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#iceGlow)"/>
  <polygon points="280,260 305,325 315,255 295,240" fill="url(#crystalGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#iceGlow)"/>
  <polygon points="130,255 142,305 152,250 140,235" fill="url(#crystalGrad)" stroke="#bae6fd" stroke-width="1.2"/>

  <!-- Shattered Ice Shards / Snowflakes -->
  <g fill="#ffffff" opacity="0.9">
    <polygon points="310,185 325,190 315,195 305,190"/>
    <polygon points="340,205 355,210 345,215 335,210"/>
    <polygon points="230,175 240,180 235,188 225,182"/>
  </g>

  <!-- Frost Glimmer Particles -->
  <circle cx="120" cy="200" r="5" fill="#ffffff" filter="url(#iceGlow)"/>
  <circle cx="60" cy="190" r="3" fill="#bae6fd"/>
  <circle cx="360" cy="205" r="4" fill="#ffffff" filter="url(#iceGlow)"/>
  <circle cx="210" cy="160" r="2.5" fill="#e0f2fe"/>
  <circle cx="240" cy="235" r="3" fill="#7dd3fc"/>
  <circle cx="300" cy="170" r="2" fill="#ffffff"/>
</svg>
